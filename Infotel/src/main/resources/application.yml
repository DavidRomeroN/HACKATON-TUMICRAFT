server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # Database Configuration (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/virtual_tryon_db?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:virtual_user}
    password: ${DB_PASSWORD:virtual_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson Configuration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:VirtualTryOnSecretKey2024ForJWTTokenGeneration}
  expiration: 86400000 # 24 hours in milliseconds

# File Storage Configuration
file:
  upload-dir: ./uploads/clothing

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - https://localhost:3000
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging Configuration
logging:
  level:
    com.virtualtryon: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/virtual_tryon_dev?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: dev_user
    password: dev_password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

---
# application.yml (o application-dev.yml si usas perfiles)
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/virtual_tryon_prod?useSSL=false&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:prod_user}
    password: ${DB_PASSWORD:prod_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.virtualtryon: INFO
    org.springframework.security: WARN

